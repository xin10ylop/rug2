]

[risk]
max_open_positions = 2
max_size_sol = 0.25                 # hard cap per trade regardless of operator policy
daily_loss_limit_sol = 0.5          # stop opening positions after this realized loss (UTC day)
min_balance_sol = 0.2
max_consecutive_losses = 6          # per operator -> operator disabled
kill_file = "STOP"                  # touch STOP to halt new buys immediately

[behaviour]
tape_minutes = 10.0
sell_retry_s = 1.2
buy_expire_slots = 20
learner_every_s = 600
